name: One-time format repair

on:
  push:
    branches: [dev/realms-expansion]

permissions:
  contents: write

concurrency:
  group: realm-format-repair
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/realms-expansion
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Format campaign files and remove temporary workflow
        run: |
          npx oxfmt docs/RealmModes.md packages/engine-api/src/game/RealmCampaign.ts packages/engine-api/src/game/RealmModes.ts src/client/SinglePlayerModal.ts src/client/hud/layers/GameLeftSidebar.ts tests/core/game/RealmCampaign.test.ts tests/core/game/RealmModes.test.ts
          git add docs/RealmModes.md packages/engine-api/src/game/RealmCampaign.ts packages/engine-api/src/game/RealmModes.ts src/client/SinglePlayerModal.ts src/client/hud/layers/GameLeftSidebar.ts tests/core/game/RealmCampaign.test.ts tests/core/game/RealmModes.test.ts
          git rm .github/workflows/one-time-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format realm campaign changes"
          git push origin HEAD:dev/realms-expansion
